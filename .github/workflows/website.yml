name: Website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['clients/web/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the website after testing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Website build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_BUILD: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - run: tar -czf ../website.tgz -C dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website
          path: website.tgz
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: production-web
    concurrency: production-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website
      - name: Check host or deploy tested website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          MODE: ${{ (github.event_name == 'push' || inputs.deploy) && 'deploy' || 'check' }}
        run: bash scripts/ci/send-release.sh "$MODE" < website.tgz
